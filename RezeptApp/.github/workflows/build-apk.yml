name: Build APK

on:
  push:
    branches: [ "claude/arzt-app-oPnJz" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle Wrapper generieren
        run: |
          cd RezeptApp
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Debug APK bauen
        run: |
          cd RezeptApp
          ./gradlew assembleDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RezeptApp-debug-apk
          path: RezeptApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK Info ausgeben
        run: |
          ls -lh RezeptApp/app/build/outputs/apk/debug/ 2>/dev/null || echo "Build Verzeichnis nicht gefunden"
