name: Build APK

on:
  push:
    branches: [ "claude/arzt-app-oPnJz" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug APK bauen
        working-directory: RezeptApp
        run: ./gradlew assembleDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RezeptApp-debug-apk
          path: RezeptApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
