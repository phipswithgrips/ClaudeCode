name: Build APK

on:
  push:
    branches: [ "claude/arzt-app-oPnJz" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android Build-Tools prüfen
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls $ANDROID_HOME/build-tools/ || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed || true

      - name: Debug APK bauen
        working-directory: RezeptApp
        run: ./gradlew assembleDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RezeptApp-debug-apk
          path: RezeptApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
