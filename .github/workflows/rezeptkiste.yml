name: Rezeptkiste

on:
  push:
    branches: [ "rezeptkiste" ]
    paths:
      - "rezeptkiste/**"
      - ".github/workflows/rezeptkiste.yml"
  workflow_dispatch:

concurrency:
  group: rezeptkiste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server-Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rezeptkiste_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: rezeptkiste/server
    env:
      RK_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/rezeptkiste_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rezeptkiste/server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Migration gegen leere Datenbank
        run: |
          psql postgresql://postgres:test@localhost:5432/postgres -c "create database rk_migration"
          RK_DATABASE_URL=postgresql+psycopg://postgres:test@localhost:5432/rk_migration alembic upgrade head
          RK_DATABASE_URL=postgresql+psycopg://postgres:test@localhost:5432/rk_migration alembic check
      - name: Docker-Image bauen
        run: docker build -t rezeptkiste-api:ci .
      - name: VPS-Konfiguration prüfen (Compose, Caddy, Installationsskript)
        working-directory: rezeptkiste/deploy
        run: |
          RK_DOMAIN=rezepte.example.de POSTGRES_PASSWORD=x docker compose -f docker-compose.yml config -q
          docker run --rm -e RK_DOMAIN=rezepte.example.de -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          bash -n install.sh

  android:
    name: Android-APK und Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rezeptkiste/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (Sync-Engine, Formatierung)
        run: ci/gradle.sh :composeApp:desktopTest
      - name: APK bauen
        run: ci/gradle.sh :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rezeptkiste-android-apk
          path: rezeptkiste/app/composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: rezeptkiste/app/composeApp/build/reports/
          retention-days: 7

  windows:
    name: Windows-Installer (MSI)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rezeptkiste/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: MSI bauen
        shell: bash
        run: ci/gradle.sh :composeApp:packageMsi
      - name: Selbsttest der fertigen App (Laufzeit, HTTPS, SQLite, DPAPI)
        shell: bash
        run: |
          exe=composeApp/build/compose/binaries/main/app/Rezeptkiste/Rezeptkiste.exe
          set +e
          "$exe" --selftest "$PWD/selftest.txt"
          code=$?
          set -e
          cat selftest.txt || true
          msg=$(sed 's/%/%25/g' selftest.txt 2>/dev/null | awk 'BEGIN{ORS="%0A"}{print}')
          if [ "$code" -ne 0 ]; then echo "::error title=Selbsttest::exit $code%0A$msg"; exit 1; fi
          echo "::notice title=Selbsttest::$msg"
          size=$(du -m composeApp/build/compose/binaries/main/msi/*.msi | cut -f1)
          echo "::notice title=MSI-Größe::${size} MB"
      - uses: actions/upload-artifact@v4
        with:
          name: rezeptkiste-windows-msi
          path: rezeptkiste/app/composeApp/build/compose/binaries/main/msi/*.msi
          retention-days: 30
