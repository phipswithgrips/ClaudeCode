# Cookfolio-Server. Nginx Proxy Manager leitet rezepte.<domain> auf api:8000.
services:
  api:
    image: rezeptkiste-api:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RK_DATABASE_URL: postgresql+psycopg://rezeptkiste:${POSTGRES_PASSWORD}@db:5432/rezeptkiste
      RK_FILES_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, proxy]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rezeptkiste
      POSTGRES_USER: rezeptkiste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezeptkiste -d rezeptkiste"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  pgdata:
  files:

networks:
  internal:
  proxy:
    # Netz, in dem Nginx Proxy Manager läuft (docker network ls)
    external: true
    name: ${PROXY_NETWORK:-npm_default}
